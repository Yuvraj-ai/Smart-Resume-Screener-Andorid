prompt_fidelity:
  status: pending
  requirement: >
    The scoring rubric in match_score_node.py is product behavior. Weights
    60/30/10, the 1-3 / 4-6 / 7-8 / 9-10 bands, and the no-inference clause
    must survive verbatim.
  planned_check: "Unit test asserting weights and bands are present; manual field-by-field diff in Step 12."

test_matrix:
  unit:
    - "Prompt fidelity assertions"
    - "Pipeline call order, call count, and mid-batch failure isolation"
    - "Room DAO CRUD, search, score histogram"
    - "Settings repository: missing key fails closed, no key in logs"
    - "PDF extraction: valid fixture, oversized, corrupt"
    - "GeminiClient via MockWebServer: 200, 400, 429, 5xx, empty candidates"
  instrumented:
    - "Dashboard rendering against seeded data"
    - "Screen flow gating and partial-success state"
    - "Navigation across all four sections"
    - "Delete confirmation"

validation_environment:
  jdk: "/tmp/opencode/jdk17 (JDK 17.0.20.1)"
  android_sdk: "~/Android/Sdk, platform 36, build-tools 36.0.0"
  avd: "onemind_test, Pixel 6, android-36, x86_64"
  adb: "available; emulator not yet booted"

unverified_and_why:
  - item: "Real Gemini responses"
    reason: "No live API key available in this environment. Verified against mocks only."
  - item: "Gradle dependency resolution"
    reason: "Requires network access to the Gradle distribution and Maven repos."
  - item: "Scoring prompt output quality"
    reason: >
      The source repo has no end-to-end test against a live model either, so
      prompt behavior parity is asserted structurally, not behaviorally.
